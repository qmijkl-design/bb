<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mustafa Khudhair - MSS STORE</title>
  <style>
    :root {
      --bg-color: #1a0933;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
      --primary-orange: #f59e0b;
      --purple-header: #2d1254;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px 10px;
      direction: rtl;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .app-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    .header-title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--purple-header);
      margin-bottom: 5px;
      border-bottom: 2px solid var(--primary-orange);
      padding-bottom: 8px;
      display: inline-block;
      width: 100%;
    }

    .store-brand {
      text-align: center;
      font-size: 13px;
      color: var(--primary-orange);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      background-color: #fafafa;
    }

    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .platforms-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      scrollbar-width: none;
    }

    .platforms-bar::-webkit-scrollbar {
      display: none;
    }

    .platform-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .platform-icon.active {
      border-color: #10b981;
      transform: scale(1.05);
    }

    .p-all { background: #e5e7eb; color: #374151; font-weight: bold; font-size: 18px; }
    .p-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
    .p-tiktok { background: #000000; color: white; }
    .p-fb { background: #1877f2; color: white; }
    .p-tg { background: #0088cc; color: white; }
    .p-yt { background: #ff0000; color: white; }
    .p-wa { background: #25d366; color: white; }
    .p-snap { background: #fffc00; color: black; }

    .field-group {
      margin-bottom: 15px;
    }

    .field-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      display: block;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-main);
      box-sizing: border-box;
      outline: none;
      background-color: #ffffff;
    }

    .service-select-wrapper {
      position: relative;
    }

    .service-badge {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: #6b7280;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      pointer-events: none;
    }

    .description-box {
      background-color: #f9fafb;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #374151;
      line-height: 1.6;
      white-space: pre-line;
      max-height: 160px;
      overflow-y: auto;
    }

    .limit-text {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .readonly-box {
      background-color: #f3f4f6;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-orange);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #d97706;
    }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header-title">طلب جديد</div>
  <div class="store-brand">مصطفى خضير | MSS STORE</div>

  <!-- البحث -->
  <div class="search-box">
    <input type="text" id="search-input" placeholder="اسم أو رقم الخدمة" oninput="filterServices()">
    <span>🔍</span>
  </div>

  <!-- المنصات -->
  <div class="platforms-bar">
    <div class="platform-icon p-all active" onclick="selectPlatform('all', this)">☰</div>
    <div class="platform-icon p-insta" onclick="selectPlatform('insta', this)">📷</div>
    <div class="platform-icon p-tiktok" onclick="selectPlatform('tiktok', this)">🎵</div>
    <div class="platform-icon p-fb" onclick="selectPlatform('fb', this)">f</div>
    <div class="platform-icon p-tg" onclick="selectPlatform('tg', this)">✈</div>
    <div class="platform-icon p-yt" onclick="selectPlatform('yt', this)">▶</div>
    <div class="platform-icon p-wa" onclick="selectPlatform('wa', this)">💬</div>
    <div class="platform-icon p-snap" onclick="selectPlatform('snap', this)">👻</div>
  </div>

  <!-- الفئة -->
  <div class="field-group">
    <label class="field-label">الفئة</label>
    <select id="category-select" onchange="onCategoryChange()">
      <option value="offers">💸 الأرخص مبيعاً اليوم</option>
      <option value="insta">📷 خدمات إنستغرام</option>
      <option value="tiktok">🎵 خدمات تيك توك</option>
      <option value="fb">📘 خدمات فيسبوك</option>
      <option value="tg">✈ خدمات تليجرام</option>
      <option value="games">🎮 شحن الألعاب</option>
    </select>
  </div>

  <!-- الخدمة -->
  <div class="field-group">
    <label class="field-label">الخدمة</label>
    <div class="service-select-wrapper">
      <select id="service-select" onchange="onServiceChange()">
        <!-- يتم تحميل الخدمات تلقائياً -->
      </select>
    </div>
  </div>

  <!-- الوصف -->
  <div class="field-group">
    <label class="field-label">الوصف</label>
    <div class="description-box" id="service-desc">
      اختر خدمة لعرض الوصف الخاص بها.
    </div>
  </div>

  <!-- الرابط -->
  <div class="field-group">
    <label class="field-label">الرابط</label>
    <input type="text" id="link-input" placeholder="https://... أو ID">
  </div>

  <!-- الكمية -->
  <div class="field-group">
    <label class="field-label">الكمية</label>
    <input type="number" id="quantity-input" placeholder="أدخل الكمية" oninput="calculateCost()">
    <div class="limit-text" id="limit-text">الحد الأدنى: - | الحد الأقصى: -</div>
  </div>

  <!-- متوسط الوقت -->
  <div class="field-group">
    <label class="field-label">متوسط وقت إكتمال الطلب 🕒</label>
    <div class="readonly-box" id="time-box">سريع جداً / فوري</div>
  </div>

  <!-- التكلفة -->
  <div class="field-group">
    <label class="field-label">التكلفة</label>
    <div class="readonly-box" id="cost-box">0 د.ع</div>
  </div>

  <!-- زر الطلب -->
  <button class="submit-btn" onclick="submitOrder()">طلب</button>
</div>

<script>
  const servicesData = [
    {
      id: "15670",
      cat: "insta",
      platform: "insta",
      name: "متابعين انستقرام تعويض تلقائي | ضمان 365 يوم",
      min: 50,
      max: 1000000,
      ratePer1000: 15000,
      time: "31 الساعات 19 الدقائق",
      desc: "متابع انستقرام [الحد الأقصى: مليون 1]\n[ضمان: 365 يوم]\n[معدل النزول: 5-0%]\n[وقت البدء: 0-1 ساعة]\n[السرعة: 100k باليوم]\n\nمهم جداً اذا كنت تريد انشاء طلب جديد:\nتعطيل خيار 'تمييز للمراجعة'\n1. انتقل إلى إعدادات الحساب.\n2. اختر خيار 'متابعة ودعوة الأصدقاء'.\n3. ابحث عن خيار 'تمييز للمراجعة' وقام بتعطيله."
    },
    {
      id: "10201",
      cat: "offers",
      platform: "insta",
      name: "ترويج متابعين إنستغرام 1k - عرض خاص",
      min: 1000,
      max: 1000,
      ratePer1000: 15000,
      time: "فوري / غضون ساعات",
      desc: "عرض خاص وسريع جداً لزيادة المتابعين مع الضمان الكامل."
    },
    {
      id: "20541",
      cat: "tiktok",
      platform: "tiktok",
      name: "متابعين تيك توك حقيقيين High Quality",
      min: 100,
      max: 500000,
      ratePer1000: 15000,
      time: "0-24 ساعة",
      desc: "متابعين تيك توك بجودة عالية وسرعة ممتازة."
    },
    {
      id: "30812",
      cat: "fb",
      platform: "fb",
      name: "متابعين صفحة فيسبوك - حسابات حقيقية",
      min: 100,
      max: 200000,
      ratePer1000: 8000,
      time: "1-12 ساعة",
      desc: "زيادة متابعين البيجات والصفحات الشخصية في فيسبوك."
    },
    {
      id: "40192",
      cat: "tg",
      platform: "tg",
      name: "أعضاء قنوات ومجموعات تليجرام",
      min: 100,
      max: 100000,
      ratePer1000: 10000,
      time: "فوري",
      desc: "أعضاء لمجموعات وقنوات التليجرام مع ثبات عالي."
    },
    {
      id: "50221",
      cat: "games",
      platform: "all",
      name: "شدات ببجي Mobile - 325 UC",
      min: 1,
      max: 10,
      ratePer1000: 7500000, // سعر القطعة 7500
      time: "فوري (1-5 دقائق)",
      desc: "شحن مباشر عبر الـ Player ID الخاص بك."
    }
  ];

  let currentPlatform = 'all';

  function init() {
    loadServices();
  }

  function selectPlatform(platform, element) {
    document.querySelectorAll('.platform-icon').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    currentPlatform = platform;
    loadServices();
  }

  function onCategoryChange() {
    loadServices();
  }

  function loadServices() {
    const catSelect = document.getElementById('category-select').value;
    const serviceSelect = document.getElementById('service-select');
    const searchValue = document.getElementById('search-input').value.toLowerCase();

    serviceSelect.innerHTML = '';

    const filtered = servicesData.filter(s => {
      const matchCat = (catSelect === 'offers' || s.cat === catSelect);
      const matchPlatform = (currentPlatform === 'all' || s.platform === currentPlatform);
      const matchSearch = s.name.toLowerCase().includes(searchValue) || s.id.includes(searchValue);
      return matchCat && matchPlatform && matchSearch;
    });

    if (filtered.length === 0) {
      const opt = document.createElement('option');
      opt.text = "لا توجد خدمات متاحة";
      opt.value = "";
      serviceSelect.appendChild(opt);
    } else {
      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.text = `[${s.id}] - ${s.name}`;
        serviceSelect.appendChild(opt);
      });
    }

    onServiceChange();
  }

  function filterServices() {
    loadServices();
  }

  function getSelectedService() {
    const id = document.getElementById('service-select').value;
    return servicesData.find(s => s.id === id);
  }

  function onServiceChange() {
    const service = getSelectedService();
    const descBox = document.getElementById('service-desc');
    const limitText = document.getElementById('limit-text');
    const timeBox = document.getElementById('time-box');

    if (service) {
      descBox.innerText = service.desc;
      limitText.innerText = `الحد الادنى: ${service.min} - الحد الاقصى: ${service.max}`;
      timeBox.innerText = service.time;
    } else {
      descBox.innerText = "لا توجد معلومات.";
      limitText.innerText = "الحد الادنى: - | الحد الاقصى: -";
      timeBox.innerText = "-";
    }
    calculateCost();
  }

  function calculateCost() {
    const service = getSelectedService();
    const qty = parseFloat(document.getElementById('quantity-input').value) || 0;
    const costBox = document.getElementById('cost-box');

    if (service && qty > 0) {
      let total = 0;
      if (service.cat === 'games') {
        total = qty * (service.ratePer1000 / 1000);
      } else {
        total = (qty / 1000) * service.ratePer1000;
      }
      costBox.innerText = total.toLocaleString() + " د.ع";
    } else {
      costBox.innerText = "0 د.ع";
    }
  }

  function submitOrder() {
    const service = getSelectedService();
    const link = document.getElementById('link-input').value;
    const qty = document.getElementById('quantity-input').value;
    const cost = document.getElementById('cost-box').innerText;

    if (!service) {
      alert("يرجى اختيار خدمة أولاً");
      return;
    }
    if (!link) {
      alert("يرجى أدخال الرابط أو الـ ID");
      return;
    }
    if (!qty || qty < service.min || qty > service.max) {
      alert(`يرجى إدخال كمية صحيحة بين ${service.min} و ${service.max}`);
      return;
    }

    const message = `طلب جديد 🚀\nالخدمة: [${service.id}] ${service.name}\nالرابط/ID: ${link}\nالكمية: ${qty}\nالتكلفة: ${cost}`;
    const url = `https://wa.me/9647815955995?text=${encodeURIComponent(message)}`;
    window.location.href = url;
  }

  window.onload = init;
</script>

</body>
</html>
