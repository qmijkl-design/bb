<script>
  const whatsappNumber = "9647815955995";
  let activeService = "";
  let activePrice = "";

  function handleSelectChange(currentSelect) {
    // عند اختيار خدمة في أحد المربعات يتم تصفير المربعات الأخرى
    if (currentSelect.value !== "") {
      const allSelects = document.querySelectorAll('.service-box');
      allSelects.forEach(select => {
        if (select !== currentSelect) {
          select.selectedIndex = 0;
        }
      });

      const selectedOption = currentSelect.options[currentSelect.selectedIndex];
      activeService = selectedOption.value;
      activePrice = selectedOption.dataset.price;

      document.getElementById('price-box').textContent = السعر الكلي: ${activePrice};
    } else {
      activeService = "";
      activePrice = "";
      document.getElementById('price-box').textContent = "السعر الكلي: اختر خدمة أولاً";
    }

    updateWhatsAppLink();
  }

  function updateWhatsAppLink() {
    const link = document.getElementById('link-input').value.trim();

    const message = طلب جديد من التطبيق 🚀\n\n +
                    *الخدمة المطلوبة:* ${activeService || 'لم يتم تحديد خدمة'}\n +
                    *السعر:* ${activePrice || '0'}\n +
                    *الرابط:* ${link || 'لم يدخل رابط'};

    const btn = document.getElementById('whatsapp-link');
    btn.href = https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)};
  }

  function validateLink(event) {
    if (!activeService) {
      alert('يرجى اختيار خدمة أولاً من القوائم الأعلاه');
      event.preventDefault();
      return false;
    }
    const link = document.getElementById('link-input').value.trim();
    if (!link) {
      alert('يرجى كتابة رابط الحساب أو المنشور أولاً');
      event.preventDefault();
      return false;
    }
    return true;
  }
</script>
