<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSS STORE - مصطفى خضير</title>
  <style>
    :root {
      --bg-color: #1a0933;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
      --primary-orange: #f59e0b;
      --purple-header: #2d1254;
      --error-color: #ef4444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px 10px;
      direction: rtl;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .app-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    .header-title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--purple-header);
      margin-bottom: 5px;
      border-bottom: 2px solid var(--primary-orange);
      padding-bottom: 8px;
      display: block;
      width: 100%;
    }

    .store-brand {
      text-align: center;
      font-size: 13px;
      color: var(--primary-orange);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      background-color: #fafafa;
    }

    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .platforms-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      scrollbar-width: none;
    }

    .platforms-bar::-webkit-scrollbar {
      display: none;
    }

    .platform-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid transparent;
      transition: all 0.2s;
      font-size: 16px;
    }

    .platform-icon.active {
      border-color: #10b981;
      transform: scale(1.08);
    }

    .p-all { background: #e5e7eb; color: #374151; font-weight: bold; }
    .p-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
    .p-tiktok { background: #000000; color: white; }
    .p-fb { background: #1877f2; color: white; }
    .p-tg { background: #0088cc; color: white; }
    .p-yt { background: #ff0000; color: white; }
    .p-wa { background: #25d366; color: white; }
    .p-snap { background: #fffc00; color: black; }

    .field-group {
      margin-bottom: 15px;
    }

    .field-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      display: block;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-main);
      box-sizing: border-box;
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    input.input-error {
      border-color: var(--error-color) !important;
      background-color: #fef2f2 !important;
    }

    .error-text {
      color: var(--error-color);
      font-size: 11px;
      margin-top: 4px;
      display: none;
      font-weight: bold;
    }

    .description-box {
      background-color: #f9fafb;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #374151;
      line-height: 1.6;
      white-space: pre-line;
      max-height: 150px;
      overflow-y: auto;
    }

    .limit-text {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .readonly-box {
      background-color: #f3f4f6;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-orange);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #d97706;
    }
  </style>
</head>

      desc: "متابع انستقرام [الحد الأقصى: مليون 1]\n[ضمان: 365 يوم]\n[معدل النزول: 5-0%]\n[وقت البدء: 0-1 ساعة]\n[السرعة: 100k باليوم]"
    }
  ];

  let currentPlatform = 'all';

  function init() {
    loadServices();
  }

  function selectPlatform(platform, element) {
    document.querySelectorAll('.platform-icon').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    currentPlatform = platform;
    
    const catSelect = document.getElementById('category-select');
    if(platform === 'yt') catSelect.value = 'yt_ads';
    else if(platform === 'wa') catSelect.value = 'wa_main';
    else if(platform === 'snap') catSelect.value = 'snap_main';
    else if(platform === 'fb') catSelect.value = 'fb_cheap';
    else if(platform === 'insta') catSelect.value = 'insta_update';

    loadServices();
  }

  function onCategoryChange() {
    loadServices();
  }

  function loadServices() {
    const catSelect = document.getElementById('category-select').value;
    const serviceSelect = document.getElementById('service-select');
    const searchValue = document.getElementById('search-input').value.toLowerCase();

    serviceSelect.innerHTML = '';

    const filtered = servicesData.filter(s => {
      const matchCat = (s.cat === catSelect || currentPlatform === 'all');
      const matchPlatform = (currentPlatform === 'all' || s.platform === currentPlatform);
      const matchSearch = s.name.toLowerCase().includes(searchValue) || s.id.includes(searchValue);
      return matchCat && matchPlatform && matchSearch;
    });

    if (filtered.length === 0) {
      const opt = document.createElement('option');
      opt.text = "لا توجد خدمات لهذا القسم حالياً";
      opt.value = "";
      serviceSelect.appendChild(opt);
    } else {
      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.text = `[${s.id}] - ${s.name} - ${s.ratePer1000.toLocaleString()} د.ع / 1000`;
        serviceSelect.appendChild(opt);
      });
    }

    onServiceChange();
  }

  function filterServices() {
    loadServices();
  }

  function getSelectedService() {
    const id = document.getElementById('service-select').value;
    return servicesData.find(s => s.id === id);
  }

  function onServiceChange() {
    const service = getSelectedService();
    const descBox = document.getElementById('service-desc');
    const limitText = document.getElementById('limit-text');
    const timeBox = document.getElementById('time-box');

    if (service) {
      descBox.innerText = service.desc;
      limitText.innerText = `الحد الادنى: ${service.min.toLocaleString()} - الحد الاقصى: ${service.max.toLocaleString()}`;
      timeBox.innerText = service.time;
    } else {
      descBox.innerText = "لا توجد معلومات للخدمة.";
      limitText.innerText = "الحد الادنى: - - الحد الاقصى: -";
      timeBox.innerText = "-";
    }
    calculateCost();
  }

  function calculateCost() {
    const service = getSelectedService();
    const qty = parseFloat(document.getElementById('quantity-input').value) || 0;
    const costBox = document.getElementById('cost-box');

    if (service && qty > 0) {
      const total = (qty / 1000) * service.ratePer1000;
      costBox.innerText = Math.round(total).toLocaleString() + " د.ع";
    } else {
      costBox.innerText = "0 د.ع";
    }
  }

  // دالة فحص الرابط أو اليوزر بدقة
  function validateLink() {
    const linkInput = document.getElementById('link-input');
    const errorText = document.getElementById('link-error');
    const val = linkInput.value.trim();

    // يجب أن يبدأ بـ http:// أو https:// أو @ وبدون مسافات
    const linkRegex = /^(https?:\/\/[^\s]+|@[a-zA-Z0-9_.-]+)$/;

    if (val === "") {
      linkInput.classList.remove('input-error');
      errorText.style.display = 'none';
      return false;
    }

    if (!linkRegex.test(val)) {
      linkInput.classList.add('input-error');
      errorText.style.display = 'block';
      return false;
    } else {
      linkInput.classList.remove('input-error');
      errorText.style.display = 'none';
      return true;
    }
  }
