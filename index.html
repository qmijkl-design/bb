<script>
  const whatsappNumber = "9647815955995";
  let activeService = "";
  let activePrice = "";

  function handleSelectChange(currentSelect) {
    if (currentSelect.value !== "") {
      const allSelects = document.querySelectorAll('.service-box');
      allSelects.forEach(select => {
        if (select !== currentSelect) {
          select.selectedIndex = 0;
        }
      });

      const selectedOption = currentSelect.options[currentSelect.selectedIndex];
      activeService = selectedOption.value;
      activePrice = selectedOption.getAttribute('data-price');

      document.getElementById('price-box').textContent = "السعر الكلي: " + activePrice;
    } else {
      activeService = "";
      activePrice = "";
      document.getElementById('price-box').textContent = "السعر الكلي: اختر خدمة أولاً";
    }
  }

  function sendToWhatsApp() {
    if (!activeService) {
      alert('يرجى اختيار خدمة أولاً من القوائم أعلاه');
      return;
    }
  : const link = document.getElementById('link-input').value.trim();

                    "*الرابط:* " + link;

    const url = "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message);
    window.open(url, '_blank');
  }
</script>
