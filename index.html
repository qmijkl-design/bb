<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSS STORE - مصطفى خضير</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f051d 0%, #2a085c 50%, #0d0118 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.2);
      --text-main: #ffffff;
      --text-sub: #b3a2ce;
      --primary-orange: #ff9f43;
      --accent-purple: #9b51e0;
      --error-red: #ff5252;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 20px 10px;
      direction: rtl;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 25px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
    }

    .header-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .store-brand {
      text-align: center;
      font-size: 13px;
      color: var(--primary-orange);
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-size: 13px;
      color: #fff;
      outline: none;
      box-sizing: border-box;
    }

    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .platforms-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .platforms-bar::-webkit-scrollbar {
      display: none;
    }

    .platform-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      font-size: 16px;
      background: var(--input-bg);
      color: #fff;
    }

    .platform-icon.active {
      border-color: var(--primary-orange);
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(255, 159, 67, 0.4);
    }

    .p-all { background: rgba(255,255,255,0.15); }
    .p-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .p-fb { background: #1877f2; }
    .p-yt { background: #ff0000; }
    .p-wa { background: #25d366; }
    .p-snap { background: #fffc00; color: #000; }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-size: 13px;
      color: #ffffff;
      box-sizing: border-box;
      outline: none;
    }

    select option {
      background-color: #1a0933;
      color: #ffffff;
    }

    input.input-error {
      border-color: var(--error-red) !important;
      background: rgba(255, 82, 82, 0.1) !important;
    }

    .error-text {
      color: var(--error-red);
      font-size: 11px;
      margin-top: 5px;
      display: none;
      font-weight: 600;
    }

    .description-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: #d1c4e9;
      line-height: 1.6;
      white-space: pre-line;
      max-height: 140px;
      overflow-y: auto;
    }

    .limit-text {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 5px;
    }

    .readonly-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-orange);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff9f43 0%, #ff5252 100%);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(255, 159, 67, 0.3);
    }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header-title">طلب جديد</div>
  <div class="store-brand">مصطفى خضير | MSS STORE</div>

  <!-- البحث -->
  <div class="search-box">
    <input type="text" id="search-input" placeholder="بحث باسم أو رقم الخدمة..." oninput="filterServices()">
    <span>🔍</span>
  </div>

  <!-- شريط المنصات -->
  <div class="platforms-bar">
    <div class="platform-icon p-all active" onclick="selectPlatform('all', this)">☰</div>
    <div class="platform-icon p-insta" onclick="selectPlatform('insta', this)">📷</div>
    <div class="platform-icon p-yt" onclick="selectPlatform('yt', this)">▶</div>
    <div class="platform-icon p-wa" onclick="selectPlatform('wa', this)">💬</div>
    <div class="platform-icon p-snap" onclick="selectPlatform('snap', this)">👻</div>
    <div class="platform-icon p-fb" onclick="selectPlatform('fb', this)">f</div>
  </div>

  <!-- اختيار الفئة -->
  <div class="field-group">
    <label class="field-label">الفئة (التطبيق)</label>
    <select id="category-select" onchange="onCategoryChange()">
      <option value="insta_update">📷 انستقرام | متابعين التحديث الجديد</option>
      <option value="yt_ads">▶ يوتيوب | مشتركين وإعلانات</option>
      <option value="wa_main">💬 واتساب | أعضاء وقنوات</option>
      <option value="snap_main">👻 سناب شات | متابعين ولايكات</option>
      <option value="fb_cheap">📘 فيسبوك | خدمات جديدة ورخيصة</option>
    </select>
  </div>

  <!-- اختيار الخدمة الخاص بالتطبيق المحدد -->
  <div class="field-group">
    <label class="field-label">الخدمة الخاصه بهذا التطبيق</label>
    <select id="service-select" onchange="onServiceChange()">
      <!-- تحميل الخدمات الخاصة بالفئة فقط -->
    </select>
  </div>

  <!-- مربع الوصف -->
  <div class="field-group">
    <label class="field-label">الوصف</label>
    <div class="description-box" id="service-desc">
      اختر الخدمة لعرض تفاصيلها.
    </div>
  </div>

  <!-- الرابط -->
  <div class="field-group">
    <label class="field-label">الرابط أو اسم الحساب</label>
    <input type="text" id="link-input" placeholder="https://instagram.com/username أو @username" oninput="validateLink()">
    <div class="error-text" id="link-error">⚠️ خطأ: يرجى كتابة رابط صحيح (https://) أو يوزر (@)</div>
  </div>

  <!-- الكمية -->
  <div class="field-group">
    <label class="field-label">الكمية</label>
    <input type="number" id="quantity-input" placeholder="أدخل الكمية المطلوب إضافتها" oninput="calculateCost()">
    <div class="limit-text" id="limit-text">الحد الأدنى: - | الحد الأقصى: -</div>
  </div>

  <!-- متوسط الوقت -->
  <div class="field-group">
    <label class="field-label">متوسط الوقت 🕒</label>
    <div class="readonly-box" id="time-box">-</div>
  </div>

  <!-- التكلفة -->
  <div class="field-group">
    <label class="field-label">التكلفة (بالدينار العراقي)</label>
    <div class="readonly-box" id="cost-box">0 د.ع</div>
  </div>

  <!-- زر الطلب -->
  <button class="submit-btn" onclick="submitOrder()">إرسال الطلب الآن</button>
</div>

<script>
  const servicesData = [
    // --- انستغرام ---
    {
      id: "15670",
      cat: "insta_update",
      platform: "insta",
      name: "انستقرام | متابعين تعويض تلقائي | ضمان 365 يوم",
      ratePer1000: 18000,
      min: 50,
      max: 1000000,
      time: "1-24 ساعة",
      desc: "متابعين انستقرام ثبات عالي مع ضمان تعويض سنة كاملة."
    },

    // --- يوتيوب ---
    {
      id: "12838",
      cat: "yt_ads",
      platform: "yt",
      name: "يوتيوب | مشاهدات عبر إعلانات رسمية | جميع الدول",
      ratePer1000: 5500,
      min: 1000,
      max: 5000000,
      time: "سريع جداً",
      desc: "مشاهدات إعلانية رسمية أمنة على القناة مع ضمان مدى الحياة."
    },
    {
      id: "18077",
      cat: "yt_ads",
      platform: "yt",
      name: "يوتيوب | مشتركين قناة بدون تعويض",
      ratePer1000: 3050,
      min: 100,
      max: 5000,
      time: "1-24 ساعة",
      desc: "زيادة مشتركين يوتيوب سريعة بدون ضمان."
    },

    // --- واتساب ---
    {
      id: "18372",
      cat: "wa_main",
      platform: "wa",
      name: "واتساب | أعضاء قناة واتساب رخيصة",
      ratePer1000: 3720,
      min: 10,
      max: 10000,
      time: "1-2 ساعة",
      desc: "أعضاء قنوات واتساب سريعة ورخيصة."
    },
    {
      id: "14317",
      cat: "wa_main",
      platform: "wa",
      name: "واتساب | أعضاء قناة عرب 🇦🇪 جودة عالية",
      ratePer1000: 13350,
      min: 100,
      max: 50000,
      time: "1-4 ساعات",
      desc: "أعضاء قنوات واتساب عرب حقيقيين."
    },

    // --- سناب شات ---
    {
      id: "13888",
      cat: "snap_main",
      platform: "snap",
      name: "سناب شات | لايكات وإعجابات عربية 👻",
      ratePer1000: 23535,
      min: 5,
      max: 10000,
      time: "فوري",
      desc: "إعجابات ولايكات سناب شات من حسابات عربية متفاعلة."
    },

    // --- فيسبوك ---
    {
      id: "17007",
      cat: "fb_cheap",
      platform: "fb",
      name: "فيسبوك | متابعين بيج وبروفايل أرخص سعر",
      ratePer1000: 4080,
      min: 100,
      max: 10000,
      time: "1-12 ساعة",
      desc: "متابعين فيسبوك بأرخص سعر متوفر."
    },
    {
      id: "11484",
      cat: "fb_cheap",
      platform: "fb",
      name: "فيسبوك | متابعات صفحات - تعويض 30 يوم ✨",
      ratePer1000: 5385,
      min: 100,
      max: 50000,
      time: "12 ساعة",
      desc: "متابعين ميكس لصفحات الفيسبوك مع ضمان تعويض تلقائي."
    }
  ];

  function init() {
    loadServices();
  }

  function selectPlatform(platform, element) {
    document.querySelectorAll('.platform-icon').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    
    const catSelect = document.getElementById('category-select');
    if (platform === 'insta') catSelect.value = 'insta_update';
    else if (platform === 'yt') catSelect.value = 'yt_ads';
    else if (platform === 'wa') catSelect.value = 'wa_main';
    else if (platform === 'snap') catSelect.value = 'snap_main';
    else if (platform === 'fb') catSelect.value = 'fb_cheap';

    loadServices();
  }

  function onCategoryChange() {
    loadServices();
  }

  function loadServices() {
    const selectedCat = document.getElementById('category-select').value;
    const serviceSelect = document.getElementById('service-select');
    const searchValue = document.getElementById('search-input').value.toLowerCase().trim();

    serviceSelect.innerHTML = '';

    // تصفية الخدمات بحسب الفئة المختارة فقط (لكل تطبيق خدماته الخاصة)
    const filtered = servicesData.filter(s => {
      const matchCat = (s.cat === selectedCat);
      const matchSearch = s.name.toLowerCase().includes(searchValue) || s.id.includes(searchValue);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      const opt = document.createElement('option');
      opt.text = "لا توجد خدمات متاحة لهذا التطبيق حالياً";
      opt.value = "";
      serviceSelect.appendChild(opt);
    } else {
      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.text = `[${s.id}] ${s.name} - ${s.ratePer1000.toLocaleString()} د.ع / 1000`;
        serviceSelect.appendChild(opt);
      });
    }

    onServiceChange();
  }

  function filterServices() {
    loadServices();
  }

  function getSelectedService() {
    const id = document.getElementById('service-select').value;
    return servicesData.find(s => s.id === id);
  }

  function onServiceChange() {
    const service = getSelectedService();
    const descBox = document.getElementById('service-desc');
    const limitText = document.getElementById('limit-text');
    const timeBox = document.getElementById('time-box');

    if (service) {
      descBox.innerText = service.desc;
      limitText.innerText = `الحد الأدنى: ${service.min.toLocaleString()} | الحد الأقصى: ${service.max.toLocaleString()}`;
      timeBox.innerText = service.time;
    } else {
      descBox.innerText = "اختر الخدمة لعرض تفاصيلها.";
      limitText.innerText = "الحد الأدنى: - | الحد الأقصى: -";
      timeBox.innerText = "-";
    }
    calculateCost();
  }

  function calculateCost() {
    const service = getSelectedService();
    const qty = parseFloat(document.getElementById('quantity-input').value) || 0;
    const costBox = document.getElementById('cost-box');

    if (service && qty > 0) {
      const total = (qty / 1000) * service.ratePer1000;
      costBox.innerText = Math.round(total).toLocaleString() + " د.ع";
    } else {
      costBox.innerText = "0 د.ع";
    }
  }

  function validateLink() {
    const linkInput = document.getElementById('link-input');
    const errorText = document.getElementById('link-error');
    const val = linkInput.value.trim();

    const urlPattern = /^(https?:\/\/[^\s]+|@[a-zA-Z0-9_.-]{3,})$/i;

    if (val === "") {
      linkInput.classList.remove('input-error');
      errorText.style.display = 'none';
      return false;
    }

    if (!urlPattern.test(val)) {
      linkInput.classList.add('input-error');
      errorText.style.display = 'block';
      return false;
    } else {
      linkInput.classList.remove('input-error');
      errorText.style.display = 'none';
      return true;
    }
  }

  function submitOrder() {
    const service = getSelectedService();
    const linkInput = document.getElementById('link-input');
    const link = linkInput.value.trim();
    const qty = document.getElementById('quantity-input').value;
    const cost = document.getElementById('cost-box').innerText;

    if (!validateLink() || link === "") {
      alert("⚠️ يرجى أدخال رابط أو يوزر صحيح للمتابعة!");
      linkInput.focus();
      return;
    }

    if (!service) {
      alert("يرجى اختيار خدمة أولاً");
      return;
    }

    if (!qty || qty < service.min || qty > service.max) {
      alert(`يرجى كتابة كمية بين ${service.min} و ${service.max}`);
      return;
    }

    const message = `طلب جديد 🚀\nالمتجر: MSS STORE (مصطفى خضير)\nالخدمة: [${service.id}] ${service.name}\nالرابط: ${link}\nالكمية: ${qty}\nالتكلفة: ${cost}`;
    window.location.href = `https://wa.me/9647815955995?text=${encodeURIComponent(message)}`;
  }

  window.onload = init;
</script>

</body>
</html>
