<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mustafa SMM Store</title>
  <style>
    :root {
      --bg-color: #0f071b;
      --text-color: #ffffff;
      --card-bg: #1a0f2e;
      --card-border: #2d1a4d;
      --subtext-color: #a78bfa;
      --order-bg: #ffffff;
      --order-text: #111111;
      --input-bg: #f9f9f9;
      --input-border: #cccccc;
      --label-color: #333333;
    }

    /* الوضع الفاتح */
    body.light-theme {
      --bg-color: #f3f4f6;
      --text-color: #1f2937;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --subtext-color: #6b7280;
      --order-bg: #ffffff;
      --order-text: #111111;
      --input-bg: #f9f9f9;
      --input-border: #cccccc;
      --label-color: #333333;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      direction: rtl;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: var(--text-color);
    }

    .logo span {
      color: #f59e0b;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-info h3 {
      margin: 0;
      font-size: 20px;
      color: var(--text-color);
    }

    .stat-info p {
      margin: 5px 0 0 0;
      color: var(--subtext-color);
      font-size: 13px;
    }

    .stat-icon {
      font-size: 26px;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .action-btn {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      border-radius: 12px;
      padding: 10px 5px;
      text-align: center;
      font-size: 12px;
      text-decoration: none;
      display: block;
    }

    .action-btn span {
      display: block;
      font-size: 18px;
      margin-bottom: 3px;
    }

    .order-card {
      background-color: var(--order-bg);
      color: var(--order-text);
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
    }

    .order-card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #6d28d9;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--label-color);
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background-color: var(--input-bg);
      font-size: 14px;
      color: #000000;
      box-sizing: border-box;
      outline: none;
    }

    .price-display {
      background-color: #f3e8ff;
      color: #6d28d9;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      background-color: #25d366;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      border: none;
      cursor: pointer;
    }

    /* تنسيق أبعاد أيقونات SVG */
    .app-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>

<script>
  var activeService = "";
  var activePrice = "";

  function updatePrice(element) {
    var boxes = document.getElementsByClassName('service-box');
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i] !== element) {
        boxes[i].selectedIndex = 0;
      }
    }

    if (element.value !== "") {
      var selected = element.options[element.selectedIndex];
      activeService = selected.value;
      activePrice = selected.getAttribute('data-price');
      document.getElementById('price-box').innerHTML = "السعر الكلي: " + activePrice;
    } else {
      activeService = "";
      activePrice = "";
      document.getElementById('price-box').innerHTML = "السعر الكلي: اختر خدمة أولاً";
    }
  }

  function sendToWhatsApp() {
    if (!activeService) {
      alert('يرجى اختيار خدمة أولاً');
      return;
    }

    var link = document.getElementById('link-input').value;
    if (!link || link.trim() === "") {
      alert('يرجى كتابة الرابط أو الـ ID أولاً');
      return;
    }

    var text = "طلب جديد 🚀\nالخدمة: " + activeService + "\nالسعر: " + activePrice + "\nالرابط/الـ ID: " + link;
    var url = "https://wa.me/9647815955995?text=" + encodeURIComponent(text);
    
    window.location.href = url;
  }

  function toggleTheme() {
    document.body.classList.toggle('light-theme');
  }
</script>
