<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSS STORE - مصطفى خضير</title>
  <style>
    :root {
      --bg-color: #f0f4f9;
      --card-bg: #ffffff;
      --card-border: #e1e8ed;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --primary-blue: #0284c7;
      --primary-hover: #0369a1;
      --error-red: #ef4444;
      --success-green: #10b981;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px 10px;
      direction: rtl;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 450px;
      border-radius: 24px;
      padding: 25px 20px;
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.06);
      box-sizing: border-box;
    }

    .header-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }

    .store-brand {
      text-align: center;
      font-size: 13px;
      color: var(--primary-blue);
      font-weight: 700;
      margin-top: 4px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary-blue);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .platforms-bar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 6px 2px 12px 2px;
      margin-bottom: 15px;
      scrollbar-width: none;
    }

    .platforms-bar::-webkit-scrollbar {
      display: none;
    }

    .platform-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      opacity: 0.7;
    }

    .platform-icon svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .platform-icon:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    .platform-icon.active {
      opacity: 1;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .p-insta {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }

    .p-tiktok {
      background: #000000;
    }

    .p-fb {
      background: #1877F2;
    }

    .p-tg {
      background: #24A1DE;
    }

    .p-yt {
      background: #FF0000;
    }

    .p-wa {
      background: #25D366;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-main);
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s;
    }

    select:focus, input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-blue);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    input.input-error {
      border-color: var(--error-red) !important;
      background: #fef2f2 !important;
    }

    .error-text {
      color: var(--error-red);
      font-size: 11px;
      margin-top: 5px;
      display: none;
      font-weight: 600;
    }

    .description-box {
      background: #f1f5f9;
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: #334155;
      line-height: 1.6;
      white-space: pre-line;
      max-height: 120px;
      overflow-y: auto;
    }

    .limit-text {
      font-size: 11px;
      color: var(--primary-blue);
      margin-top: 5px;
      font-weight: 600;
    }

    .readonly-box {
      background: #f8fafc;
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      color: var(--primary-blue);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-blue);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .submit-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>

  function init() {
    loadServices();
  }

  function selectPlatform(platform, element) {
    const icons = document.querySelectorAll('.platform-icon');
    if (icons) icons.forEach(el => el.classList.remove('active'));
    if (element) element.classList.add('active');
    
    const catSelect = document.getElementById('category-select');
    if (catSelect) {
      if (platform === 'insta') catSelect.value = 'insta_main';
      else if (platform === 'tiktok') catSelect.value = 'tiktok_main';
      else if (platform === 'fb') catSelect.value = 'fb_main';
      else if (platform === 'tg') catSelect.value = 'tg_main';
      else if (platform === 'yt') catSelect.value = 'yt_main';
      else if (platform === 'wa') catSelect.value = 'wa_main';
    }

    loadServices();
  }

  function onCategoryChange() {
    loadServices();
  }

  function loadServices() {
    const catSelect = document.getElementById('category-select');
    const serviceSelect = document.getElementById('service-select');
    const searchInput = document.getElementById('search-input');

    if (!catSelect || !serviceSelect) return;

    const selectedCat = catSelect.value;
    const searchValue = searchInput ? searchInput.value.toLowerCase().trim() : '';

    serviceSelect.innerHTML = '';

    const filtered = servicesData.filter(s => {
      const matchCat = (s.cat === selectedCat);
      const matchSearch = s.name.toLowerCase().includes(searchValue) || s.id.includes(searchValue);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      const opt = document.createElement('option');
      opt.text = "لا توجد خدمات متاحة حالياً";
      opt.value = "";
      serviceSelect.appendChild(opt);
    } else {
      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.text = `[${s.id}] ${s.name}`;

      });
    }

    onServiceChange();
  }

  function filterServices() {
    loadServices();
  }

  function getSelectedService() {
    const serviceSelect = document.getElementById('service-select');
    if (!serviceSelect) return null;
    const id = serviceSelect.value;
    return servicesData.find(s => s.id === id);
  }

  function onServiceChange() {
    const service = getSelectedService();
    const descBox = document.getElementById('service-desc');
    const limitText = document.getElementById('limit-text');
    const timeBox = document.getElementById('time-box');
    const qtyInput = document.getElementById('quantity-input');

    if (service) {
      if (descBox) descBox.innerText = service.desc;
      if (timeBox) timeBox.innerText = service.time;
      
      if (service.isFlatRate) {
        if (limitText) limitText.innerText = `الخدمة سعر ثابت (حملة واحدة = 10$)`;
        if (qtyInput) qtyInput.value = 1;
      } else {
        if (limitText) limitText.innerText = `الحد الأدنى: ${service.min.toLocaleString()} | الحد الأقصى: ${service.max.toLocaleString()}`;
      }
    } else {
      if (descBox) descBox.innerText = "اختر الخدمة لعرض تفاصيلها.";
      if (limitText) limitText.innerText = "الحد الأدنى: - | الحد الأقصى: -";
      if (timeBox) timeBox.innerText = "-";
    }
    calculateCost();
  }
