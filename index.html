<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mustafa SMM Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f071b;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      direction: rtl;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
    }

    .logo span {
      color: #f59e0b;
    }

    .stat-card {
      background-color: #1a0f2e;
      border: 1px solid #2d1a4d;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-info h3 {
      margin: 0;
      font-size: 20px;
      color: #ffffff;
    }

    .stat-info p {
      margin: 5px 0 0 0;
      color: #a78bfa;
      font-size: 13px;
    }

    .stat-icon {
      font-size: 26px;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .action-btn {
      flex: 1;
      background-color: #1a0f2e;
      border: 1px solid #2d1a4d;
      color: #ffffff;
      border-radius: 12px;
      padding: 10px 5px;
      text-align: center;
      font-size: 12px;
      text-decoration: none;
      display: block;
    }

    .action-btn span {
      display: block;
      font-size: 18px;
      margin-bottom: 3px;
    }

    .order-card {
      background-color: #ffffff;
      color: #111111;
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
    }

    .order-card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #6d28d9;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333333;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cccccc;
      background-color: #f9f9f9;
      font-size: 14px;
      color: #000000;
      box-sizing: border-box;
      outline: none;
    }

    .price-display {
      background-color: #f3e8ff;
      color: #6d28d9;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      background-color: #25d366;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">MUSTAFA <span>SMM</span></div>
    <div>☰</div>
  </div>

  <div class="stat-card">
    <div class="stat-info">
      <h3>13,773,533</h3>
      <p>طلبات مكتملة</p>
    </div>
    <div class="stat-icon">📊</div>
  </div>

  <div class="stat-card">
    <div class="stat-info">
      <h3>طلب مباشر</h3>
      <p>الدفع والتنفيذ فوراً عبر الواتساب</p>
    </div>
    <div class="stat-icon">💬</div>
  </div>

  <div class="quick-actions">
    <a href="https://wa.me/9647815955995" class="action-btn" target="_blank">
      <span>🎧</span> الدعم الفني
    </a>
    <a href="javascript:void(0)" class="action-btn" onclick="alert('طرق الدفع المتاحة: زين كاش / آسيا حوالة (تواصل عبر الواتساب)')">
      <span>💳</span> طرق الدفع
    </a>
    <a href="https://wa.me/9647815955995" class="action-btn" target="_blank">
      <span>📜</span> سجل الطلبات
    </a>
  </div>

  <div class="order-card">
    <h2>طلب جديد 🚀</h2>

    <!-- العروض والخصومات -->
    <div class="form-group">
      <label>🔥 العروض الخاصة والخصومات:</label>
      <select id="select-offers" class="service-box" onchange="updatePrice(this)">
        <option value="" data-price="0">-- اختر عرض خاص --</option>
        <option value="ترويج متابعين إنستغرام 1k" data-price="15,000 د.ع">ترويج متابعين إنستغرام - 1k (15,000 د.ع)</option>
        <option value="ترويج متابعين إنستغرام 3k" data-price="40,000 د.ع">ترويج متابعين إنستغرام - 3k (40,000 د.ع)</option>
        <option value="ترويج صفحة فيسبوك 3 أيام" data-price="30,000 د.ع">ترويج صفحة فيسبوك - 3 أيام (30,000 د.ع)</option>
      </select>
    </div>

    <!-- خدمات إنستغرام -->
    <div class="form-group">
      <label>📸 خدمات إنستغرام:</label>
      <select id="select-insta" class="service-box" onchange="updatePrice(this)">
        <option value="" data-price="0">-- اختر خدمة إنستغرام --</option>
        <option value="ترويج إنستغرام ممول - فيديوهات حقيقي (10,000 د.ع)" data-price="10,000 د.ع">ترويج إنستغرام ممول - فيديوهات حقيقي (10,000 د.ع)</option>
        <option value="متابعين إنستغرام (ضمان) - 1,000 متابع حقيقي (15,000 د.ع)" data-price="15,000 د.ع">متابعين إنستغرام (ضمان) - 1,000 متابع حقيقي (15,000 د.ع)</option>
        <option value="لايكات إنستغرام حقيقي - 1,000 لايك (8,000 د.ع)" data-price="8,000 د.ع">لايكات إنستغرام حقيقي - 1,000 لايك (8,000 د.ع)</option>
        <option value="مشاهدات ريلز - 10,000 مشاهدة وهمي (5,000 د.ع)" data-price="5,000 د.ع">مشاهدات ريلز - 10,000 مشاهدة وهمي (5,000 د.ع)</option>
      </select>
    </div>

    <!-- خدمات فيسبوك -->
    <div class="form-group">
      <label>📘 خدمات فيسبوك:</label>
      <select id="select-facebook" class="service-box" onchange="updatePrice(this)">
        <option value="" data-price="0">-- اختر خدمة فيسبوك --</option>
        <option value="ترويج فيسبوك - يوم واحد" data-price="15,000 د.ع">ترويج فيسبوك - يوم واحد (15,000 د.ع)</option>
        <option value="ترويج فيسبوك - أسبوع كامل" data-price="70,000 د.ع">ترويج فيسبوك - أسبوع كامل (70,000 د.ع)</option>
        <option value="متابعين صفحة فيسبوك - 1,000" data-price="8,000 د.ع">متابعين صفحة فيسبوك - 1,000 متابع (8,000 د.ع)</option>
      </select>
    </div>

    <!-- خدمات تيك توك -->
    <div class="form-group">
      <label>🎵 خدمات تيك توك:</label>
      <select id="select-tiktok" class="service-box" onchange="updatePrice(this)">
        <option value="" data-price="0">-- اختر خدمة تيك توك --</option>
        <option value="متابعين تيك توك - 1,000" data-price="15,000 د.ع">متابعين تيك توك - 1,000 متابع (15,000 د.ع)</option>
        <option value="مشاهدات تيك توك - 10,000" data-price="8,000 د.ع">مشاهدات تيك توك - 10,000 مشاهدة (8,000 د.ع)</option>
      </select>
    </div>

    <!-- خدمات تليجرام -->
    <div class="form-group">
      <label>✈️ خدمات تليجرام:</label>
      <select id="select-telegram" class="service-box" onchange="updatePrice(this)">
        <option value="" data-price="0">-- اختر خدمة تليجرام --</option>
        <option value="أعضاء قنوات تليجرام - 1,000" data-price="10,000 د.ع">أعضاء قنوات تليجرام - 1,000 عضو (10,000 د.ع)</option>
      </select>
    </div>

    <div class="form-group">
      <label>رابط الحساب / المنشور المطلوب:</label>
      <input type="text" id="link-input" placeholder="https://...">
    </div>

    <div class="price-display" id="price-box">
      السعر الكلي: اختر خدمة أولاً
    </div>

    <button type="button" class="submit-btn" onclick="sendToWhatsApp()">
      تأكيد الطلب عبر الواتساب 💬
    </button>
  </div>

</div>

<script>
  var activeService = "";
  var activePrice = "";

  function updatePrice(element) {
    var boxes = document.getElementsByClassName('service-box');
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i] !== element) {
        boxes[i].selectedIndex = 0;
      }
    }

    if (element.value !== "") {
      var selected = element.options[element.selectedIndex];
      activeService = selected.value;
      activePrice = selected.getAttribute('data-price');
      document.getElementById('price-box').innerHTML = "السعر الكلي: " + activePrice;
    } else {
      activeService = "";
      activePrice = "";
      document.getElementById('price-box').innerHTML = "السعر الكلي: اختر خدمة أولاً";
    }
  }

  function sendToWhatsApp() {
    if (!activeService) {
      alert('يرجى اختيار خدمة أولاً');
      return;
    }

    var link = document.getElementById('link-input').value;
    if (!link || link.trim() === "") {
      alert('يرجى كتابة الرابط أولاً');
      return;
    }

    var text = "طلب جديد 🚀\nالخدمة: " + activeService + "\nالسعر: " + activePrice + "\nالرابط: " + link;
    var url = "https://wa.me/9647815955995?text=" + encodeURIComponent(text);
    
    window.location.href = url;
  }
</script>

</body>
</html>
